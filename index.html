<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado Libre</title>
</head>
<body>
    <nav class="navbar">
    <div class="logo">MercadoLibre</div>

    <div class="location">
        Enviar a: Colombia
    </div>

    <div class="search-bar">
        <input type="text" placeholder="Buscar productos, marcas y más...">
        <button>Buscar</button>
    </div>

    <div class="menu">
        <a href="#">Categorías</a>
        <a href="#">Ofertas</a>
        <a href="#">Cuenta</a>
        <a href="#">Carrito</a>
    </div>
</nav>
 
     <section class="product-search">

    <div class="filters">
        <h3>Filtros</h3>

        <label>Precio</label>
        <input type="range">

        <label>Marca</label>
        <select>
            <option>Samsung</option>
            <option>Apple</option>
            <option>Xiaomi</option>
        </select>
    </div>

    <div class="search-results">
        <h2>Resultados de búsqueda</h2>
    </div>


 </section>

 <section class="product-list">

    <div class="product-card">
        <img src="producto1.jpg" alt="Producto">
        <h3>Celular Samsung Galaxy</h3>
        <p class="price">$1.200.000</p>
        <p class="shipping">Envío gratis</p>
        <button>Ver producto</button>
    </div>

    <div class="product-card">
        <img src="producto2.jpg" alt="Producto">
        <h3>Audífonos Bluetooth</h3>
        <p class="price">$150.000</p>
        <p class="shipping">Envío gratis</p>
        <button>Ver producto</button>
    </div>

</section>

</body>
</html>
