<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mercado Ocupado</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-area">
        <div class="logo-wrap">
          <div class="logo-icon">🤝</div>
          <div class="logo-text">Mercado Libre</div>
        </div>
        <div class="location">
          <span class="location-label">Enviar a</span>
          <strong>Colombia</strong>
        </div>
      </div>

      <div class="search-wrapper">
        <div class="search-bar">
          <input type="text" placeholder="Buscar productos, marcas y más..." />
          <button aria-label="Buscar">⌕</button>
        </div>

        <div class="header-links">
          <a href="#">Categorías</a>
          <a href="#">Ofertas</a>
          <a href="#">Historial</a>
          <a href="#">Supermercado</a>
          <a href="#">Moda</a>
          <a href="#">Vender</a>
          <a href="#">Ayuda</a>
        </div>
      </div>

      <nav class="user-menu">
        <div class="portfolio-menu">
          <span>Portafolios</span>
          <div class="portfolio-dropdown">
            <a href="./dev-portafolio-1/index.html">Dev Portafolio 1</a>
            <a href="./dev-portafolio-2/index.html">Dev Portafolio 2</a>
            <a href="./dev-portafolio-3/index.html">Dev Portafolio 3</a>
          </div>
        </div>

        <a href="#">Crea tu cuenta</a>
        <a href="#">Ingresa</a>
        <a href="#">Mis compras</a>
        <a href="#">🛒</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="product-search">
      <aside class="filters">
        <h3>Filtros</h3>

        <div class="filter-block">
          <label>Precio máximo</label>
          <input type="range" />
        </div>

        <div class="filter-block">
          <label>Marca</label>
          <select>
            <option value="">Todas</option>
            <option>Samsung</option>
            <option>Apple</option>
            <option>Xiaomi</option>
          </select>
        </div>
      </aside>

      <section class="results-area">
        <div class="search-results">
          <h2>Resultados</h2>
        </div>

        <section class="product-list">
          <!-- render dinámico -->
        </section>
      </section>
    </section>
  </main>
</body>
</html>
